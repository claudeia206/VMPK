name: Windows MSVC CI

on:
  push:
    branches: [ "master", "devel" ]
  pull_request:
    branches: [ "master", "devel" ]
  workflow_dispatch:

env:
  BUILD_TYPE: RelWithDebInfo
  DRUMSTICKNAME: DrumstickV2
  DRUMSTICK_LOCATION: ${{github.workspace}}/DrumstickV2
  INSTALL_LOCATION: VMPK

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { icon: '🟦', arch: "win64", os: "windows-latest", triplet: "x64-windows", qtarch: 'win64_msvc2022_64' }
          - { icon: '🟩', arch: "arm64", os: "windows-11-arm", triplet: "arm64-windows", qtarch: 'win64_msvc2022_arm64' }
    runs-on: ${{ matrix.os }}
    name: 🚧${{ matrix.icon }} msvc ${{ matrix.arch }}
    defaults:
      run:
        shell: cmd

    steps:
    - uses: actions/checkout@v7

    - name: '${{ matrix.icon }} Download Drumstick'
      uses: dawidd6/action-download-artifact@v27
      with:
        name: ${{env.DRUMSTICKNAME}}-msvc-${{matrix.arch}}
        github_token: ${{ secrets.GH_PAT || github.token }}
        repo: pedrolcl/drumstick
        allow_forks: false
        workflow: win-msvc.yml
        branch: devel
        path: ${{env.DRUMSTICKNAME}}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        arch: ${{matrix.qtarch}}
        version: '6.10.3'

    - name: '${{ matrix.icon }} Build vcpkg'
      uses: johnwason/vcpkg-action@v8
      id: vcpkg
      with:
        pkgs: fluidsynth[sndfile]
        triplet: ${{ matrix.triplet }}
        token: ${{ github.token }}

    - name: '${{ matrix.icon }} Install NSIS'
      uses: repolevedavaj/install-nsis@v1.3.0
      with:
        nsis-version: '3.12'

    - name: '${{ matrix.icon }} Setup MSVC'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: ${{ matrix.arch }}

    - name: '${{ matrix.icon }} Configure CMake'
      id: configuration
      run: >
        cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}
        -G Ninja -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_PREFIX_PATH=${{github.workspace}}/${{env.DRUMSTICKNAME}};${{github.workspace}}/vcpkg/installed/${{matrix.triplet}}
        -DCMAKE_INSTALL_PREFIX=${{env.INSTALL_LOCATION}}
        -DCPACK_SYSTEM_NAME=${{matrix.arch}}
        -DBUILD_DOCS=OFF
        -DINSTALL_DEPENDENCIES=ON
        -DEMBED_TRANSLATIONS=ON

    - name: '${{ matrix.icon }} Build'
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: '${{ matrix.icon }} Package'
      run: cmake --build ${{github.workspace}}/build --target package

    - name: '${{ matrix.icon }} Install'
      run: cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: '${{ matrix.icon }} Smoke-test NSIS installer'
      shell: pwsh
      env:
        PACKAGE_VERSION: ${{steps.configuration.outputs.config_version}}
      run: |
        $ErrorActionPreference = 'Stop'
        $installerPattern = "VMPK-v$($env:PACKAGE_VERSION)-Windows-*.exe"
        $installer = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\build" -Filter $installerPattern -File | Select-Object -First 1
        if (-not $installer) {
          throw "NSIS installer not found: $installerPattern"
        }

        # Use a unique path without spaces; NSIS requires /D to be the final argument.
        $installRoot = Join-Path $env:RUNNER_TEMP ("vmpk-smoke-" + [System.Guid]::NewGuid().ToString('N'))
        $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
        if ($process.ExitCode -ne 0) {
          throw "NSIS installer exited with code $($process.ExitCode)"
        }

        $executable = Join-Path $installRoot 'vmpk.exe'
        $platformPlugin = Join-Path $installRoot 'platforms\qwindows.dll'
        if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
          throw "Installed executable not found: $executable"
        }
        if (-not (Test-Path -LiteralPath $platformPlugin -PathType Leaf)) {
          throw "Bundled Qt Windows platform plugin not found: $platformPlugin"
        }

        # Prevent the Qt SDK installed for compilation from masking missing bundled files.
        if ($env:QT_ROOT_DIR) {
          $qtBin = [System.IO.Path]::GetFullPath((Join-Path $env:QT_ROOT_DIR 'bin')).TrimEnd('\')
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_.TrimEnd('\') -ine $qtBin }) -join ';'
        }
        $env:QT_PLUGIN_PATH = $null
        $env:QT_QPA_PLATFORM_PLUGIN_PATH = $null
        $env:QT_QPA_PLATFORM = $null
        $env:QML2_IMPORT_PATH = $null
        $env:QT_ROOT_DIR = $null

        & $executable --version
        if ($LASTEXITCODE -ne 0) {
          throw "Installed VMPK --version failed with exit code $LASTEXITCODE"
        }

    - name: '${{ matrix.icon }} Upload Artifacts'
      uses: actions/upload-artifact@v7
      with:
        name: VMPK-msvc-${{matrix.arch}}
        path: ${{env.INSTALL_LOCATION}}
        retention-days: 90
        overwrite: true

    - name: '${{ matrix.icon }} Upload Installer'
      uses: actions/upload-artifact@v7
      with:
        name: VMPK-msvc-installer-${{matrix.arch}}
        path: ${{github.workspace}}/build/VMPK-v${{steps.configuration.outputs.config_version}}-Windows-*.exe
        retention-days: 90
        overwrite: true
        archive: false
