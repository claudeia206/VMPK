name: Linux CI

on:
  push:
    branches: [ "devel", "master" ]
  pull_request:
    branches: [ "devel", "master" ]
  workflow_dispatch:

env:
  BUILD_TYPE: RelWithDebInfo
  DRUMSTICK_LOCATION: ${{github.workspace}}/DrumstickV2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
        include:
          - { icon: '🟥', arch: "x86_64", os: "self-hosted", triplet: "x64-linux-dynamic" }
          - { icon: '🟩', arch: "aarch64", os: "ubuntu-24.04-arm", triplet: "arm64-linux-dynamic" }
    runs-on: ${{ matrix.os }}
    name: '${{ matrix.icon }} Linux ${{ matrix.arch }}'

    steps:
    - uses: actions/checkout@v7

    - name: '${{ matrix.icon }} Install system dependencies'
      run: |
        retry_apt() {
          for attempt in $(seq 1 60); do
            if sudo apt-get "$@"; then
              return 0
            fi
            echo "APT/DPKG est occupé ou indisponible (tentative $attempt/60). Nouvelle tentative dans 5 secondes."
            sleep 5
          done
          echo "APT est resté indisponible après 5 minutes."
          return 1
        }

        retry_apt update -y -o Acquire::Retries=3
        retry_apt install -yq --no-install-recommends \
          autoconf \
          autoconf-archive \
          automake \
          libtool \
          pkg-config \
          libasound2-dev \
          libpulse-dev \
          libsndfile1-dev \
          python3-venv \
          python3.12-venv \
          libltdl-dev

    - name: '${{ matrix.icon }} Set up CMake'
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '4.4.x' # https://github.com/microsoft/vcpkg/issues/53135

    - name: '${{ matrix.icon }} VCPKG Build'
      uses: johnwason/vcpkg-action@v8
      id: vcpkg
      with:
        pkgs: zlib sonivox fluidsynth[pipewire,pulseaudio,sndfile]
        triplet: ${{ matrix.triplet }}
        token: ${{ github.token }}
        revision: master

    # Qt 6.11.2 archives are misdetected by aqtinstall on Python 3.12.
    # Pin 6.11.1 until the runner uses Python 3.14 (fixes CPython zipfile detection).
    - name: '${{ matrix.icon }} Install Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.1'
        modules: 'qt5compat'
        setup-python: 'false'
      env:
        PIP_BREAK_SYSTEM_PACKAGES: '1'

    - name: '${{ matrix.icon }} Build Drumstick from source'
      run: |
        # Pin Drumstick to the exact upstream revision validated by the previous green CI.
        DRUMSTICK_REVISION=23da19d05ad511bd9140a2d00eedead2ae5bac1a
        git init Drumstick-source
        git -C Drumstick-source remote add origin https://github.com/pedrolcl/drumstick.git
        git -C Drumstick-source fetch --depth 1 origin "$DRUMSTICK_REVISION"
        git -C Drumstick-source checkout --detach FETCH_HEAD
        test "$(git -C Drumstick-source rev-parse HEAD)" = "$DRUMSTICK_REVISION"
        cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} \
          -S Drumstick-source \
          -B Drumstick-build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX="${{env.DRUMSTICK_LOCATION}}" \
          -DBUILD_DOCS=OFF \
          -DBUILD_UTILS=OFF \
          -DBUILD_TESTING=OFF
        cmake --build Drumstick-build --config ${{env.BUILD_TYPE}} --parallel 2
        cmake --install Drumstick-build --config ${{env.BUILD_TYPE}}

    - name: '${{ matrix.icon }} Verify local Drumstick installation'
      run: |
        test -d "${{env.DRUMSTICK_LOCATION}}"
        find "${{env.DRUMSTICK_LOCATION}}" -type f -path '*/cmake/drumstick/*-config.cmake' -print -quit | grep -q .

    - name: '${{ matrix.icon }} Configure CMake'
      id: configuration
      run: >
        cmake ${{ steps.vcpkg.outputs.vcpkg-cmake-config }}
        -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_PREFIX_PATH="${{env.DRUMSTICK_LOCATION}}"
        -DCMAKE_INSTALL_PREFIX=/usr
        -DCMAKE_INSTALL_LIBDIR=lib
        -DCMAKE_INSTALL_RPATH="\\$ORIGIN/../lib"
        -DBUILD_DOCS=OFF
        -DINSTALL_DEPENDENCIES=ON
        -DEMBED_TRANSLATIONS=ON

    - name: '${{ matrix.icon }} Build VMPK'
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 2

    - name: '${{ matrix.icon }} Install'
      env:
        DESTDIR: ${{github.workspace}}/build/vmpk-v${{steps.configuration.outputs.config_version}}-${{matrix.arch}}.AppDir
      run: cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: '${{ matrix.icon }} Archive'
      env:
        INSTALL_LOCATION: vmpk-v${{steps.configuration.outputs.config_version}}-${{matrix.arch}}.AppDir
      run: |
        cd ${{github.workspace}}/build/
        tar -cvzf ${{env.INSTALL_LOCATION}}.tar.gz ${{env.INSTALL_LOCATION}}

    - name: '${{ matrix.icon }} Upload Archive'
      env:
        INSTALL_LOCATION: vmpk-v${{steps.configuration.outputs.config_version}}-${{matrix.arch}}.AppDir
      uses: actions/upload-artifact@v7
      with:
        name: ${{env.INSTALL_LOCATION}}
        path: ${{github.workspace}}/build/${{env.INSTALL_LOCATION}}.tar.gz
        retention-days: 90
        overwrite: true
        archive: false

    - name: '${{ matrix.icon }} Upload AppImage'
      env:
        INSTALL_LOCATION: vmpk-v${{steps.configuration.outputs.config_version}}-${{matrix.arch}}.AppImage
      uses: actions/upload-artifact@v7
      with:
        name: ${{env.INSTALL_LOCATION}}
        path: ${{github.workspace}}/build/${{env.INSTALL_LOCATION}}
        retention-days: 90
        overwrite: true
        archive: false
